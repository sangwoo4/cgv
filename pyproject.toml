[project]
name = "cgv-alarm"
version = "0.1.0"
description = "CGV 매진 회차 취소표 알림"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "curl-cffi>=0.16.3",
]

[project.scripts]
cgv-alarm = "cgv_alarm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cgv_alarm"]

[dependency-groups]
dev = ["pytest>=8"]
