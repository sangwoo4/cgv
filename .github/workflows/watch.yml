name: watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write  # 봇 명령으로 바뀐 config.yaml 커밋용

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # 수동 실행 시 러너에서 CGV API가 뚫리는지(Cloudflare) 확인용
      - name: API smoke test
        if: github.event_name == 'workflow_dispatch'
        run: uv run cgv-alarm lookup theater 용산

      # actions/cache는 키가 불변이라, 매 실행 고유 키로 저장하고
      # restore-keys 접두사 매칭으로 가장 최근 state를 복원한다
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      # cron 최소 간격이 5분이라, 잡 하나가 1분 간격으로 4회 체크해서
      # 체감 감시 간격을 ~1분으로 좁힌다
      - name: Check
        run: uv run cgv-alarm loop --interval 60 --rounds 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # 텔레그램 /watch, /remove 명령이 config.yaml을 바꿨으면 커밋
      - name: Commit watch changes
        if: always()
        run: |
          if ! git diff --quiet config.yaml; then
            git config user.name "cgv-alarm-bot"
            git config user.email "noreply@github.com"
            git add config.yaml
            git commit -m "bot: 감시 대상 변경"
            git pull --rebase origin main
            git push
          fi
